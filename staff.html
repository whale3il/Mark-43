<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aureus Staff Portal — Private Wealth Desk</title>
    <meta
      name="description"
      content="Independent Aureus Staff Portal for Private Wealth Specialists: real-time client conversations, ticket resolution, AI copilot drafting, and desk availability."
    />
    <meta property="og:title" content="Aureus Staff Portal — Private Wealth Desk" />
    <meta
      property="og:description"
      content="Dedicated staff operations workspace for Aureus Private Banking client support, tickets, and real-time concierge desk."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('aureus_theme');
          var root = document.documentElement;
          if (saved === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-neutral-950 text-neutral-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="staff-root"></div>
    <script type="module" src="/staff-portal/src/main.tsx"></script>
  </body>
</html>
